name: Build Road Legends APK

concurrency:
  group: roadlegends-android-build
  cancel-in-progress: true
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate temporary release signing key
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 32)"
          STORE="$RUNNER_TEMP/roadlegends-release.keystore"
          keytool -genkeypair -v \
            -keystore "$STORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias roadlegends \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Road Legends, OU=Build, O=Road Legends, L=Local, ST=Local, C=US"
          echo "ROADLEGENDS_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ROADLEGENDS_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ROADLEGENDS_KEY_ALIAS=roadlegends" >> "$GITHUB_ENV"
          echo "ROADLEGENDS_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: road-legends-android9-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          jarsigner -verify -verbose app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
