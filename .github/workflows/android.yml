name: Build Key Contacts APK

concurrency:
  group: keycontacts-android-build
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate CI signing key
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 32)"
          STORE="$RUNNER_TEMP/keycontacts-release.keystore"
          keytool -genkeypair -v -keystore "$STORE" -storepass "$PASS" -keypass "$PASS" -alias keycontacts -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Key Contacts, OU=Build, O=Key Contacts, L=Local, ST=Local, C=US"
          echo "KEYCONTACTS_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "KEYCONTACTS_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEYCONTACTS_KEY_ALIAS=keycontacts" >> "$GITHUB_ENV"
          echo "KEYCONTACTS_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$code" >> build.log
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-contacts-build-log
          path: build.log
          if-no-files-found: error
      - name: Verify APK
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: key-contacts-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Fail build when Gradle failed
        if: steps.build.outcome == 'failure'
        run: exit 1
