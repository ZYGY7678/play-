name: Build Road Legends APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: road-legends-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as base64 build artifact
        if: success()
        run: |
          set -e
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > /tmp/road-legends-debug.apk.b64
          echo "$GITHUB_SHA" > /tmp/road-legends-build-sha.txt
          git fetch origin build-artifacts:build-artifacts 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/build-artifacts; then
            git switch build-artifacts
          else
            git switch --orphan build-artifacts
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/road-legends-debug.apk.b64 RoadLegends-debug.apk.b64
          cp /tmp/road-legends-build-sha.txt RoadLegends-build-sha.txt
          git add RoadLegends-debug.apk.b64 RoadLegends-build-sha.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish verified Road Legends APK" || true
          git push origin HEAD:build-artifacts
