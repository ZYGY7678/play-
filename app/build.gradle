plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zygy.roadlegends'
    compileSdk 35

    defaultConfig {
        // New install-safe application id so it does not conflict with older
        // builds signed with a different temporary CI key.
        applicationId 'com.zygy.roadlegends.fixed'
        minSdk 28
        targetSdk 28
        versionCode 5
        versionName '2.1'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ROADLEGENDS_STORE_FILE')
            def storePasswordValue = System.getenv('ROADLEGENDS_STORE_PASSWORD')
            def keyAliasValue = System.getenv('ROADLEGENDS_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ROADLEGENDS_KEY_PASSWORD')
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
