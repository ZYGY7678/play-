plugins { id 'com.android.application' }

android {
    namespace 'com.example.contacts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.contacts'
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_7
        targetCompatibility JavaVersion.VERSION_7
    }
}

dependencies {
}
