plugins { id 'com.android.application' }

android {
    namespace 'com.example.contacts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.contacts'
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def sf = System.getenv('KEYCONTACTS_STORE_FILE')
            def sp = System.getenv('KEYCONTACTS_STORE_PASSWORD')
            def ka = System.getenv('KEYCONTACTS_KEY_ALIAS')
            def kp = System.getenv('KEYCONTACTS_KEY_PASSWORD')
            if (sf && sp && ka && kp) {
                storeFile file(sf)
                storePassword sp
                keyAlias ka
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
